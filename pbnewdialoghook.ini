; pbnewdialoghook.ini - configures the custom entries added to the PowerBuilder
; "File > New" dialog. Lives next to pbnewdialoghook.dll. Re-read every time the list
; is (re)populated, so edits take effect immediately - no rebuild or reload.
;
; Placeholders usable in Label and Args:
;   %t   current target, as shown in the dialog's "Target:" box
;        e.g.  peat demo app (C:\...\PFC2025 - Solution)
;   %T   target NAME only, without the " (path)" suffix  e.g.  peat demo app
;   %n   newline (handy in :msgbox)
;   %%   a literal percent sign
;
; Command is either a program (exe/bat/cmd/anything ShellExecute can open) or a
; built-in action:
;   :clipboard   copy Args to the clipboard
;   :msgbox      show Args in a message box
; Args are passed on the command line (quote paths that may contain spaces).
; Dir (optional) sets the working directory for a program.
; Icon (optional) is a path to an .ico shown next to the entry in the list.

[pbnewdialoghook]
Items=2

; Default category tab for entries that don't set their own Tab=.
; Entries attach to the object ICON LIST, so use a tab that shows that list:
; PB Object, DataWindow, Database, Project, Project Object, Library, Tool.
; (The "Solution"/"Workspace" page uses big buttons instead of the icon list,
;  so entries there have nowhere sensible to go - don't target it.)
Tab=PB Object

; Turn on a debug log by setting Log=1. LogFile is optional; if omitted the log
; is written to pbnewdialoghook.log next to the DLL.
Log=0
; LogFile=C:\Users\me\Downloads\pbnewdialoghook\pbnewdialoghook.log

[Item1]
Label=My template object
Icon=C:\Tools\mine.ico
Command=C:\Tools\mytool.exe
Args="%t"
; Dir=C:\Tools
; Tab=PB Object

[Item2]
Label=Show current target
Command=:msgbox
Args=Target: %t%nName:   %T
